name: Bug report
description: Something in the game or the engine does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `cargo run --release`
        2. Drive into the river
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The window title (e.g. `Columbina Auto v0.1.0`) or the commit hash.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - WSL
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, a screenshot or a short GIF.
      render: text
